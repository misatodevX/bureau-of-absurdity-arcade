name: Deploy arcade to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the arcade
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static site
        run: |
          mkdir _site
          cp -R index.html arcade.css arcade.js assets games _site/
          cp .nojekyll _site/
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
